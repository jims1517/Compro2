<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Coffee List</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: radial-gradient(circle, #1a1a1a, #000000); /* Dark gradient background */
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      color: #50cfff; /* Glowing cyan for the header */
      text-align: center;
      font-size: 2.5rem;
      padding: 20px;
      text-shadow: 0 0 15px rgba(80, 207, 255, 0.8); /* Glowing effect */
    }
    table {
      width: 80%;
      border-collapse: collapse;
      margin-top: 20px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.8); /* Dark shadow for the table */
      background-color: rgba(30, 30, 30, 0.8); /* Dark, semi-transparent table background */
    }
    th, td {
      padding: 12px;
      text-align: left;
    }
    th {
      background-color: #6A4C9C; /* Dark purple for table header */
      color: white;
      text-shadow: 0 0 5px rgba(0, 0, 0, 0.6); /* Slight glow effect */
    }
    tr:nth-child(even) {
      background-color: rgba(255, 255, 255, 0.05); /* Very dark rows with light opacity */
    }
    tr:nth-child(odd) {
      background-color: rgba(255, 255, 255, 0.1); /* Darker odd rows */
    }
    a {
      text-decoration: none;
      color: #50cfff; /* Cyan for links */
      font-weight: bold;
      transition: color 0.3s;
    }
    a:hover {
      color: #ff4500; /* Red on hover */
    }
    .add-button {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 15px;
      background-color: #FF4500; /* Red color */
      color: white;
      text-decoration: none;
      border-radius: 5px;
      box-shadow: 0 4px 10px rgba(255, 69, 0, 0.5); /* Subtle shadow for button */
      transition: background-color 0.3s, transform 0.2s ease-in-out;
    }
    .add-button:hover {
      background-color: #50cfff; /* Cyan hover effect */
      transform: scale(1.05); /* Slight scale effect on hover */
    }
    .search-bar {
      margin-bottom: 20px;
      text-align: center;
    }
    .search-bar input {
      padding: 10px;
      width: 50%;
      border: 1px solid #50cfff; /* Cyan border for search input */
      border-radius: 5px;
      background-color: rgba(255, 255, 255, 0.1); /* Dark background for input */
      color: white;
    }
    .search-bar button {
      padding: 10px 20px;
      background-color: #009CDE; /* Blue button color */
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 5px;
      transition: background-color 0.3s;
    }
    .search-bar button:hover {
      background-color: #6A4C9C; /* Purple hover effect */
    }
  </style>
</head>
<body>
<h1>Available Coffees</h1>

<!-- Search Bar -->
<div class="search-bar">
  <form action="/" method="get">
    <input type="text" name="search" placeholder="Search coffees..." />
    <button type="submit">Search</button>
  </form>
</div>

<table border="1">
  <tr>
    <th>ID</th>
    <th>Name</th>
    <th>Type</th>
    <th>Size</th>
    <th>Price</th>
    <th>Roast Level</th>
    <th>Origin</th>
    <th>Decaf</th>
    <th>Stock</th>
    <th>Flavor Notes</th>
    <th>Brew Method</th>
    <th>Actions</th>
    <th>Delete</th>
  </tr>
  <tr th:each="coffee : ${coffees}">
    <td th:text="${coffee.id}"></td>
    <td th:text="${coffee.name}"></td>
    <td th:text="${coffee.type}"></td>
    <td th:text="${coffee.size}"></td>
    <td th:text="${coffee.price}"></td>
    <td th:text="${coffee.roastLevel}"></td>
    <td th:text="${coffee.origin}"></td>
    <td th:text="${coffee.decaf} ? 'Yes' : 'No'"></td>
    <td th:text="${coffee.stock}"></td>
    <td th:text="${#strings.arrayJoin(coffee.flavorNotes, ', ')}"></td>
    <td th:text="${coffee.brewMethod}"></td>
    <td>
      <a th:href="@{/edit(id=${coffee.id})}">Edit</a>
    </td>
    <td>
      <a th:href="@{/delete(id=${coffee.id})}">Delete</a>
    </td>
  </tr>
</table>
<a href="/add" class="add-button">Add New Coffee</a>
</body>
</html>

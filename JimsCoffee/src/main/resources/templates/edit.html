<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Update Coffee</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: radial-gradient(circle, #2f2f2f, #000000); /* Dark, moody gradient */
            color: #e0e0e0; /* Light gray for readability */
        }

        h1 {
            color: #50cfff; /* Glowing light cyan for the header */
            text-align: center;
            text-shadow: 0 0 15px rgba(80, 207, 255, 0.8); /* Glowing effect */
        }

        form {
            max-width: 500px;
            margin: 0 auto;
            background-color: rgba(30, 30, 30, 0.8); /* Dark background with transparency */
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.8); /* Darker shadow with a subtle glow effect */
        }

        label {
            display: block;
            margin: 10px 0;
            color: #b0b0b0; /* Light gray text for labels */
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            background-color: #333333; /* Dark input background */
            border: 1px solid #444444; /* Slightly lighter border */
            color: #ffffff; /* White text inside inputs */
            border-radius: 5px;
            transition: border-color 0.3s ease-in-out;
        }

        input:focus, select:focus {
            border-color: #50cfff; /* Light cyan border on focus */
            outline: none;
        }

        button {
            margin-top: 20px;
            padding: 10px 15px;
            background-color: #ff4500; /* Vibrant orange-red for button */
            color: #ffffff; /* White text */
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s, transform 0.2s ease-in-out;
        }

        button:hover {
            background-color: #ff6347; /* Lighter orange-red on hover */
            transform: scale(1.05); /* Slight scaling effect on hover */
        }

        a {
            text-decoration: none;
            color: #ffcc00; /* Yellow link color, fits with the Solo Leveling vibe */
            font-weight: bold;
            margin-top: 20px;
            display: inline-block;
            text-align: center;
            transition: color 0.3s;
        }

        a:hover {
            color: #50cfff; /* Cyan on hover */
        }

    </style>
</head>
<body>

<h1>Update Coffee</h1>

<form action="/update" method="post">
    <input type="hidden" name="id" th:value="${coffee.id}">

    <label>Name: <input type="text" name="name" th:value="${coffee.name}" required></label>
    <label>Type: <input type="text" name="type" th:value="${coffee.type}" required></label>
    <label>Size: <input type="text" name="size" th:value="${coffee.size}" required></label>
    <label>Price: <input type="number" step="0.01" name="price" th:value="${coffee.price}" required></label>
    <label>Roast Level: <input type="text" name="roastLevel" th:value="${coffee.roastLevel}" required></label>
    <label>Origin: <input type="text" name="origin" th:value="${coffee.origin}" required></label>
    <label>Decaf:
        <select name="isDecaf">
            <option value="true" th:selected="${coffee.decaf}">Yes</option>
            <option value="false" th:selected="${!coffee.decaf}">No</option>
        </select>
    </label>
    <label>Stock: <input type="number" name="stock" th:value="${coffee.stock}" required></label>
    <label>Flavor Notes (comma-separated):
        <input type="text" name="flavorNotes" th:value="${#strings.arrayJoin(coffee.flavorNotes, ', ')}">
    </label>
    <label>Brew Method: <input type="text" name="brewMethod" th:value="${coffee.brewMethod}" required></label>

    <button type="submit">Update Coffee</button>
</form>

<a href="/">Back to List</a>

</body>
</html>
